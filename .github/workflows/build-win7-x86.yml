name: Build Windows 7 32-bit desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-win7-x86.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'public/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build renderer for Electron 22 (Chromium 108)
        run: npm run build:electron

      - name: Package Windows 7 32-bit installer
        run: npx electron-builder --win nsis --ia32 --config.electronVersion=22.3.27 --config.win.artifactName=ElFishawy-Cafe-Setup-Win7-32bit.exe --publish never

      - name: Verify packaged executable is 32-bit
        shell: pwsh
        run: |
          $exePath = 'release/win-unpacked/ElFishawy Cafe.exe'
          if (-not (Test-Path $exePath)) { throw "Packaged executable not found: $exePath" }
          $bytes = [System.IO.File]::ReadAllBytes($exePath)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x014c) { throw ('Expected x86 PE 0x014c; found 0x{0:X4}' -f $machine) }
          Write-Output 'Verified IA32 PE machine type 0x014c.'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ElFishawy-Cafe-Win7-32bit
          path: release/ElFishawy-Cafe-Setup-Win7-32bit.exe
          if-no-files-found: error
